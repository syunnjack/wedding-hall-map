name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 以前は rsync でアプリ本体ごと転送し、その場で migrate/seed まで走らせていたが、
# 必要なシークレット（APP_KEY など）が無く一度も成功しないまま失敗し続けていた。
# また --delete に public_html の除外が無く、有効化するとドキュメントルートごと
# 消える構成だった。他の同型サイトと同じ、public/ だけを送る形に戻す。
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/kekkonshikijo-map.jp/public_html/'
          sftp_only: true
          delete_remote_files: false

      # public/ しか送っていなかったため、blade を直してもデプロイでは反映
      # されなかった。サーバ上では public_html が app/public へのシンボリック
      # リンクで、Laravel 本体は <ドメイン>/app/ に置かれている。
      #   ~/kekkonshikijo-map.jp/app/            リポジトリのルート相当
      #   ~/kekkonshikijo-map.jp/public_html  -> app/public
      #
      # 消す操作は一切しない。views の更新だけを届ける。
      # Blade はコンパイル済みビューと元ファイルの更新時刻を比べるので、
      # アップロードすれば次のリクエストで作り直される。
      #
      # 注意: app/ routes/ config/ は対象外なので、コントローラやルートを
      # 変えたときは別途デプロイが要る。
      - name: Deploy views to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './resources/*'
          remote_path: '/home/xs501620/kekkonshikijo-map.jp/app/resources/'
          sftp_only: true
          delete_remote_files: false
