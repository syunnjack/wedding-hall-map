name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 以前は rsync でアプリ本体ごと転送し、その場で migrate/seed まで走らせていたが、
# 必要なシークレット（APP_KEY など）が無く一度も成功しないまま失敗し続けていた。
# また --delete に public_html の除外が無く、有効化するとドキュメントルートごと
# 消える構成だった。他の同型サイトと同じ、public/ だけを送る形に戻す。
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/kekkonshikijo-map.jp/public_html/'
          sftp_only: true
          delete_remote_files: false
